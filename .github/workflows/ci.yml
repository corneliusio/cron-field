name: CI

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: verify (${{ matrix.versions }} versions)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                versions: [locked, minimum]
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/setup@v3
              with:
                  version: 11
                  runtime: node@26
                  cache: true
                  require-lockfile: true
            # The lowest versions the README and peerDependencies claim; change them together.
            - if: matrix.versions == 'minimum'
              run: pnpm add -D croner@10.0.0 cron-parser@5.10.1 effect@4.0.0 react@19.0.0 react-dom@19.0.0 svelte@5.0.0 vue@3.4.0
            - run: pnpm verify
